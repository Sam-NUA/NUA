name: Smart Table Service acceptance

on:
  pull_request:
    paths:
      - 'backend/routes/table_service.py'
      - 'backend/services/table_service_alerts.py'
      - 'backend/services/table_pacing.py'
      - 'backend/tests/inprocess/test_table_service_alerts.py'
      - 'frontend/src/components/SmartTableAlerts.jsx'
      - 'frontend/src/components/settings/SmartTableServiceSettings.jsx'
      - 'frontend/src/components/floor/TableInfoDrawer.jsx'
      - '.github/workflows/smart-table-service.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supplemental focused validation: the existing CI dependency audits and
# security gates remain required for merge. This workflow never disables them.
jobs:
  service-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci_table_service
      JWT_SECRET: ci-test-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile touched backend sources
        run: python -m py_compile routes/table_service.py services/table_service_alerts.py services/table_pacing.py
      - name: Run smart table service and tenant regression suites
        run: >
          python -m pytest -q
          tests/inprocess/test_table_service_alerts.py
          tests/inprocess/test_table_course_vip_and_overdue.py
          tests/inprocess/test_table_courses_tenant_isolation.py
          tests/inprocess/test_floor_plans_tenant_isolation.py

  renderer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REACT_APP_BACKEND_URL: https://smart-service-smoke.example.invalid
      PUBLIC_URL: /
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React renderer
        working-directory: frontend
        run: npm run build
