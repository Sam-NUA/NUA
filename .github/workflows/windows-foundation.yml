name: Windows foundation
on:
  pull_request:
    paths: ['apps/windows/**', 'packages/platform-core/**', 'frontend/**', '.github/workflows/windows-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Reserved .invalid domain: never sends CI requests to a real venue.
      REACT_APP_BACKEND_URL: https://windows-api.invalid
      NUA_WINDOWS_API_ORIGIN: https://windows-api.invalid
      PUBLIC_URL: /
      CI: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: apps/windows
      - run: npm test
        working-directory: apps/windows
      - run: python scripts/generate_app_icons.py
      - run: npm run build
        working-directory: frontend
      - run: npm run prepare:renderer
        working-directory: apps/windows
      - run: node scripts/smoke.cjs
        working-directory: apps/windows
      - run: npm run dist
        working-directory: apps/windows
      - uses: actions/upload-artifact@v4
        with:
          name: nua-windows-foundation-unsigned
          path: apps/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 7
  critical-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REACT_APP_BACKEND_URL: https://127.0.0.1:8443
      NUA_WINDOWS_API_ORIGIN: https://127.0.0.1:8443
      PUBLIC_URL: /
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real backend and in-memory test database
        run: python -m pip install -r backend/requirements.txt mongomock-motor
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: apps/windows
      - run: python scripts/generate_app_icons.py
      - run: npm run build
        working-directory: frontend
      - run: npm run prepare:renderer
        working-directory: apps/windows
      - name: Generate and trust a throwaway loopback certificate
        id: certificate
        timeout-minutes: 2
        shell: pwsh
        run: |
          python apps/windows/scripts/acceptance-cert.py
          # Hosted Windows runners are administrators. The machine store
          # avoids the interactive user-root trust dialog; validation stays on.
          $certificate = Import-Certificate -FilePath "$env:RUNNER_TEMP/nua-acceptance-cert.pem" -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Cash sale, process kill, tenant switch and exactly-once replay
        shell: pwsh
        working-directory: apps/windows
        run: |
          $env:NODE_EXTRA_CA_CERTS = "$env:RUNNER_TEMP/nua-acceptance-cert.pem"
          node scripts/critical-acceptance.cjs
      - name: Remove throwaway certificate and key
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.certificate.outputs.thumbprint }}') {
            Remove-Item 'Cert:\LocalMachine\Root\${{ steps.certificate.outputs.thumbprint }}' -ErrorAction SilentlyContinue
          }
          Remove-Item "$env:RUNNER_TEMP/nua-acceptance-key.pem" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-critical-acceptance-backend-log
          path: |
            ${{ runner.temp }}/nua-windows-backend.log
            ${{ runner.temp }}/nua-windows-acceptance.png
          retention-days: 7
