name: CI

# Run the complete quality/security suite on PRs and every branch, including
# main. Vercel Git integration builds releases; this workflow never deploys
# to another hosting platform.
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bookings-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bookings-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bookings-api/requirements.txt
      - name: Install service and test dependencies
        run: pip install -r requirements.txt pytest==9.1.1 mongomock-motor==0.0.36
      - name: Verify booking boundaries and webhook recovery
        run: python -m pytest tests -q

  # ─── Backend: the in-process suite + quality/security gates ────────────
  # backend/tests/*.py (the 50+ files outside tests/inprocess/) all talk to a
  # live BASE_URL and were never runnable here. backend/tests/inprocess mounts
  # the real app through TestClient with an in-memory Mongo, so it needs
  # nothing but Python — no service containers, no boot step.
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (error-only — see backend/.flake8 for why this isn't full style enforcement)
        run: python -m flake8 .
      - name: Type check (report only — informational mypy output, superseded
          as a merge gate by the differential check below)
        run: python -m mypy --ignore-missing-imports server.py || true
      - name: Type check — differential baseline gate (fails if the mypy
          error count grows past backend/mypy_baseline_count.txt, or a new
          error code appears that wasn't already accepted — see
          backend/scripts/check_type_baseline.py for why a raw "zero new
          errors" gate isn't meaningful on this codebase's motor stubs)
        run: python scripts/check_type_baseline.py
      - name: Dependency vulnerability scan (report only — informational
          pip-audit output, superseded as a merge gate by the differential
          check below)
        run: python -m pip_audit -r requirements.txt || true
      - name: Dependency vulnerability scan — differential baseline gate
          (fails on any advisory for a package, or advisory id for an
          already-tracked package, not yet triaged in
          backend/dependency_baseline.json — see backend/SECURITY_DEPENDENCY_DEBT.md
          and backend/scripts/check_dependency_baseline.py)
        run: python scripts/check_dependency_baseline.py
      - name: Run in-process test suite
        # ADMIN_EMAIL/ADMIN_PASSWORD/DEMO_STAFF_PASSWORD/SUPPORT_OVERRIDE_KEY
        # are deliberately NOT set here — tests/inprocess/conftest.py sets
        # them via os.environ.setdefault() to values that match the
        # credentials the test suite itself asserts against (e.g. the OWNER
        # constant). Setting a different value here would win over that
        # setdefault and break every test that logs in as the seeded owner.
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_tests
          JWT_SECRET: ci-test-secret-not-for-production
        run: python -m pytest tests/inprocess -v

  # ─── Secret scanning — fails the build on a real finding ────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Frontend: build + lint + audit ─────────────────────────────────────
  # Build, explicit undefined-reference lint, Jest and runtime dependency audit.
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability scan (report only — see frontend/SECURITY_DEPENDENCY_DEBT.md)
        run: npm audit --audit-level=high || true
      - name: Runtime dependency audit (no accepted advisories)
        run: npm audit --omit=dev --audit-level=low
      - name: Frontend undefined references and JSX syntax
        run: npm run lint
      - name: Unit tests (Jest — platform abstraction, device capability detection)
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Native automation async-script contract
        run: npm run test:native-tools
      - name: Build
        run: npm run build
        env:
          CI: true

  # ─── End-to-end: golden-path smoke suite ────────────────────────────────
  # Boots the real FastAPI app (mongomock-backed, no DB service container
  # needed) and the production frontend build, then drives both with a real
  # browser. See frontend/playwright.config.js for exactly what "golden
  # path" covers — this is a smoke suite, not full regression coverage.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true
      - name: Run Playwright E2E suite
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: true
      - name: Upload Playwright report and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
