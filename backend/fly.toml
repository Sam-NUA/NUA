# Fly.io config for the Nua backend (FastAPI).
# Rename `app = "..."` to something globally unique before first deploy.
# Run:  cd /app/backend && flyctl launch --no-deploy && flyctl deploy

app = "nua-backend"
primary_region = "syd"   # syd=Sydney, lax=Los Angeles, lhr=London, fra=Frankfurt, nrt=Tokyo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  grace_period = "10s"
  method = "get"
  path = "/api/ready"
  protocol = "http"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
