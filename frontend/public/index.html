<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Web routes may be opened directly at /book/v/:venue or /track/:id.
      // Resolve the initial relative CRA assets from the web root before
      // loading them; publicPath.js can only fix chunks after JS has loaded.
      // Preserve relative assets for native/file builds.
      if (/^https?:$/.test(window.location.protocol)) {
        var assetBase = document.createElement('base');
        assetBase.href = '/';
        document.head.appendChild(assetBase);
      }
    </script>
    <!-- NUA brand favicons — see brand/BRAND-SPEC.md -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/nua-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f58c14" />
    <meta
      name="description"
      content="NUA POS — hospitality on NUA OS. Point of sale, kitchen, reservations, inventory and NUA AI insights."
    />
    <!-- Open Graph / Twitter Card — without these, a shared NUA link (e.g. an
         online-ordering storefront link, or the app itself) previewed on
         Slack, iMessage, or social with no image or title at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NUA POS" />
    <meta property="og:title" content="NUA POS" />
    <meta
      property="og:description"
      content="NUA POS — hospitality on NUA OS. Point of sale, kitchen, reservations, inventory and NUA AI insights."
    />
    <meta property="og:image" content="%PUBLIC_URL%/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NUA POS" />
    <meta
      name="twitter:description"
      content="NUA POS — hospitality on NUA OS. Point of sale, kitchen, reservations, inventory and NUA AI insights."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon-180x180.png" />
    <link rel="manifest" id="nua-manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NUA POS</title>
    <script>
      // One build serves three front doors (app. / staff. / owner.), so the
      // install prompt has to describe whichever one you're actually on —
      // otherwise a crew member adding the staff app to their home screen
      // gets an icon labelled "NUA POS" that opens the till. Runs before the
      // bundle loads so the browser reads the right manifest first time.
      // Mirrors the resolution order in src/lib/appShell.js.
      (function () {
        try {
          var VALID = ['pos', 'staff', 'owner'];
          var shell = new URLSearchParams(window.location.search).get('shell');
          if (!shell || VALID.indexOf(shell) === -1) {
            shell = localStorage.getItem('nua_app_shell');
          }
          if (!shell || VALID.indexOf(shell) === -1) {
            var host = window.location.hostname || '';
            shell = host.indexOf('staff.') === 0 ? 'staff'
                  : host.indexOf('owner.') === 0 ? 'owner' : 'pos';
          }
          if (shell === 'pos') return;
          var link = document.getElementById('nua-manifest');
          if (link) link.setAttribute('href', '/manifest.' + shell + '.json');
          document.title = shell === 'staff' ? 'NUA Crew' : 'NUA Pulse';
        } catch (e) { /* keep the default manifest */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Service worker with auto-recovery: if a new SW takes control (i.e. an
      // old cached bundle was being served), reload immediately so the user
      // gets the fresh app code. Also force an update check on every load.
      if ('serviceWorker' in navigator) {
        var didReload = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (didReload) return;
          didReload = true;
          window.location.reload();
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
            // Wipe any stale caches left by previous SW versions
            if (reg.active) reg.active.postMessage('PURGE');
            reg.update().catch(function(){});
            // If a new worker is waiting, activate it immediately
            if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
            reg.addEventListener('updatefound', function() {
              var nw = reg.installing;
              if (nw) nw.addEventListener('statechange', function() {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  nw.postMessage('SKIP_WAITING');
                }
              });
            });
          }).catch(function(){});
        });
      }
    </script>
  </body>
</html>
